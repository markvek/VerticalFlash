name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm ci --prefix agent-kit/mcp

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm test

      - run: npm test --prefix agent-kit/mcp

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
